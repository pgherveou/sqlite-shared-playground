[package]
name = "sqlite-shared-playground"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
smol = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["ffi-sqlite-wasm-rs", "cache", "functions"] }
sqlite-wasm-rs = { version = "0.6.2", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent", "Event", "EventTarget"] }
serde-wasm-bindgen = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
